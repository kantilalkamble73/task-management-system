<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Task Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body id="body">

<div class="container mt-5">

    <!-- Heading -->
    <h1 class="text-center mb-5 fw-bold">
		Task Management System
    </h1>
    <!-- Logout Button -->
    <div class="d-flex justify-content-end mb-3">

        <form th:action="@{/logout}" method="post">

            <button class="btn btn-danger">
                Logout
            </button>

        </form>
    </div>
	
	<div class="d-flex justify-content-end mb-3">

	    <button onclick="toggleDarkMode()" 
	            class="btn btn-dark">

	        🌙 Dark Mode

	    </button>

	</div>

	<!-- Search + Filter -->
	<div class="row mb-4">

	    <!-- Search -->
	    <div class="col-md-8">

	        <form th:action="@{/search}" method="get">

	            <div class="input-group">

	                <input type="text"
	                       name="keyword"
	                       class="form-control"
	                       placeholder="Search by titles...">

	                <button class="btn btn-dark" type="submit">
	                    Search
	                </button>

	            </div>

	        </form>

	    </div>

	    <!-- Status Filter -->
	    <div class="col-md-4">

	        <form th:action="@{/filter}" method="get">

	            <div class="input-group">

	                <select name="status" class="form-select">

	                    <option value="">Filter By Status</option>

	                    <option value="Pending">Pending</option>

	                    <option value="In Progress">In Progress</option>

	                    <option value="Completed">Completed</option>

	                </select>

	                <button class="btn btn-primary" type="submit">
	                    Filter
	                </button>

	            </div>

	        </form>

	    </div>

	</div>
    <!-- Dashboard Cards -->
    <div class="row mb-4">

        <!-- Total Tasks -->
        <div class="col-md-3">

            <div class="card text-white bg-primary shadow">

                <div class="card-body text-center">

                    <h5>Total Tasks</h5>

                    <h2 th:text="${totalTasks}"></h2>

                </div>

            </div>

        </div>

        <!-- Pending -->
        <div class="col-md-3">

            <div class="card text-dark bg-warning shadow">

                <div class="card-body text-center">

                    <h5>Pending</h5>

                    <h2 th:text="${pendingTasks}"></h2>

                </div>

            </div>

        </div>

        <!-- Completed -->
        <div class="col-md-3">

            <div class="card text-white bg-success shadow">

                <div class="card-body text-center">

                    <h5>Completed</h5>

                    <h2 th:text="${completedTasks}"></h2>

                </div>

            </div>

        </div>

        <!-- High Priority -->
        <div class="col-md-3">

            <div class="card text-white bg-danger shadow">

                <div class="card-body text-center">

                    <h5>High Priority</h5>

                    <h2 th:text="${highPriorityTasks}"></h2>

                </div>

            </div>

        </div>

    </div>

    <!-- Success Message -->
    <div th:if="${success}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">

        <span th:text="${success}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>

    <!-- Add Task Button -->
    <a href="/add" class="btn btn-primary mb-3">
        Add Task
    </a>

	<a href="/download/pdf"
	   class="btn btn-success mb-3">

	    Download PDF

	</a>
	
    <!-- Table -->
    <div class="table-responsive">

		<table id="taskTable"
		       class="table table-bordered table-hover">

            <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Status</th>
                <th>Priority</th>
                <th>Due Date</th>
                <th>Alert</th>
                <th>Action</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="task : ${tasks}">

                <td th:text="${task.id}"></td>

                <td th:text="${task.title}"></td>

                <td th:text="${task.description}"></td>

                <!-- Status -->
                <td>

                    <span th:switch="${task.status}">

                        <span th:case="'Pending'"
                              class="badge bg-warning text-dark"
                              th:text="${task.status}">
                        </span>

                        <span th:case="'Completed'"
                              class="badge bg-success"
                              th:text="${task.status}">
                        </span>

                        <span th:case="'In Progress'"
                              class="badge bg-primary"
                              th:text="${task.status}">
                        </span>

                        <span th:case="*"
                              class="badge bg-secondary"
                              th:text="${task.status}">
                        </span>

                    </span>

                </td>

                <!-- Priority -->
                <td>

                    <span th:switch="${task.priority}">

                        <span th:case="'High'"
                              class="badge bg-danger"
                              th:text="${task.priority}">
                        </span>

                        <span th:case="'Medium'"
                              class="badge bg-primary"
                              th:text="${task.priority}">
                        </span>

                        <span th:case="'Low'"
                              class="badge bg-secondary"
                              th:text="${task.priority}">
                        </span>

                        <span th:case="*"
                              class="badge bg-dark"
                              th:text="${task.priority}">
                        </span>

                    </span>

                </td>

                <!-- Due Date -->
                <td th:text="${task.dueDate}"></td>

				<!-- Due Date Alert -->
				<td>

				    <!-- OVERDUE -->
				    <span class="badge bg-danger"
				          th:if="${task.dueDate != null
				          and task.dueDate.isBefore(T(java.time.LocalDate).now())
				          and task.status != 'Completed'}">

				        Overdue

				    </span>

				    <!-- TODAY -->
				    <span class="badge bg-warning text-dark"
				          th:if="${task.dueDate != null
				          and task.dueDate.isEqual(T(java.time.LocalDate).now())
				          and task.status != 'Completed'}">

				        Today

				    </span>

				    <!-- DUE SOON -->
				    <span class="badge bg-info text-dark"
				          th:if="${task.dueDate != null
				          and task.dueDate.isAfter(T(java.time.LocalDate).now())
				          and task.dueDate.isBefore(T(java.time.LocalDate).now().plusDays(4))
				          and task.status != 'Completed'}">

				        Due Soon

				    </span>

				</td>


                <!-- Action -->
                <td>

                    <a th:href="@{/edit/{id}(id=${task.id})}"
                       class="btn btn-warning btn-sm">
                        Edit
                    </a>

                    <a th:href="@{/delete/{id}(id=${task.id})}"
                       class="btn btn-danger btn-sm">
                        Delete
                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>

function toggleDarkMode() {

    let body = document.getElementById("body");

    let table = document.getElementById("taskTable");

    body.classList.toggle("bg-dark");

    body.classList.toggle("text-white");

    table.classList.toggle("table-dark");

    // Save mode
    if(body.classList.contains("bg-dark")) {

        localStorage.setItem("darkMode", "enabled");

    } else {

        localStorage.setItem("darkMode", "disabled");

    }

}

// Load saved mode
window.onload = function () {

    if(localStorage.getItem("darkMode") === "enabled") {

        let body = document.getElementById("body");

        let table = document.getElementById("taskTable");

        body.classList.add("bg-dark");

        body.classList.add("text-white");

        table.classList.add("table-dark");

    }

}

</script>
</body>
</html>
